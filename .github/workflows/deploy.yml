name: Build & Deploy to Dokploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_ci:
        description: "Emergency only: deploy without waiting for CI"
        type: boolean
        default: false

# Least privilege: only build-and-push writes packages (ghcr.io).
permissions:
  contents: read

concurrency:
  group: deploy-security-partners
  cancel-in-progress: false

jobs:
  # The trigger is unchanged; the deploy now waits for the full CI run.
  ci:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || !inputs.skip_ci) }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    needs: ci
    # main only (a manual dispatch can pick another branch); skipped CI only
    # for an explicit emergency dispatch.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.ci.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_ci)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    # !cancelled(): with skip_ci the skipped `ci` job would otherwise skip
    # this job too (implicit success() over the whole needs chain).
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.build-and-push.result == 'success' }}
    runs-on: ubuntu-latest
    # Created on first use; required reviewers are an owner setting.
    environment: production
    steps:
      - name: Trigger Dokploy Deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          echo "Triggering Dokploy deploy for security-partners..."
          curl --fail-with-body -sS -X POST "$DOKPLOY_URL/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"composeId":"NTWy3Bk2X7d8g25YMsbn2","title":"Deploy from GitHub Actions (${{ github.sha }})"}'
          echo "Deployment successfully triggered on Dokploy."
