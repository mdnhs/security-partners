name: Build & Deploy to Dokploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_ci:
        description: "Emergency only: deploy without waiting for CI"
        type: boolean
        default: false

# Least privilege: only build-and-push writes packages (ghcr.io).
permissions:
  contents: read

concurrency:
  group: deploy-security-partners
  cancel-in-progress: false

jobs:
  # The trigger is unchanged; the deploy now waits for the full CI run.
  ci:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || !inputs.skip_ci) }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    needs: ci
    # main only (a manual dispatch can pick another branch); skipped CI only
    # for an explicit emergency dispatch.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.ci.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_ci)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Makes sure the Dokploy compose app has every variable it needs before a
  # deploy (docs/runbook.md "Deploy"). It only ADDS missing keys — existing
  # values are never changed, so the database password and auth secret
  # generated on the first run stay — except SP_IMPORT_KEY and
  # SP_IMPORT_SOURCE_SECRET, which follow their repo secrets when set.
  # Dokploy v0.30.8 API (x-api-key header; procedures and input schemas
  # verified in the v0.30.8 sources: apps/dokploy/server/api/routers/compose.ts
  # and packages/server/src/db/schema/compose.ts, served as REST by the
  # OpenAPI adapter, https://docs.dokploy.com/docs/api):
  #   GET  /api/compose.one?composeId=…          → compose incl. env (KEY=VALUE lines), autoDeploy
  #   POST /api/compose.update {composeId, autoDeploy:false}
  #   POST /api/compose.saveEnvironment {composeId, env, createEnvFile:true}
  ensure-env:
    needs: build-and-push
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.build-and-push.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Ensure Dokploy environment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          COMPOSE_ID: NTWy3Bk2X7d8g25YMsbn2
          SITE_URL: https://security.raynx.ie
          IN_SP_R2_ACCOUNT_ID: ${{ secrets.SP_R2_ACCOUNT_ID }}
          IN_SP_R2_ACCESS_KEY_ID: ${{ secrets.SP_R2_ACCESS_KEY_ID }}
          IN_SP_R2_SECRET_ACCESS_KEY: ${{ secrets.SP_R2_SECRET_ACCESS_KEY }}
          IN_SP_R2_BUCKET: ${{ secrets.SP_R2_BUCKET }}
          IN_SP_IMPORT_KEY: ${{ secrets.SP_IMPORT_KEY }}
          IN_SP_IMPORT_SOURCE_SECRET: ${{ secrets.SP_IMPORT_SOURCE_SECRET }}
        run: |
          set -euo pipefail
          # Masked: secret values only (masking "sp" or the site URL would garble every log line).
          SECRET_KEYS=" POSTGRES_PASSWORD DATABASE_URL BETTER_AUTH_SECRET SP_R2_ACCOUNT_ID SP_R2_ACCESS_KEY_ID SP_R2_SECRET_ACCESS_KEY SP_IMPORT_SOURCE_SECRET SP_IMPORT_KEY "
          is_secret() { [[ "$SECRET_KEYS" == *" $1 "* ]]; }
          mask() { if [ -n "$1" ]; then echo "::add-mask::$1"; fi; }
          for v in "$DOKPLOY_API_KEY" "$IN_SP_R2_ACCOUNT_ID" "$IN_SP_R2_ACCESS_KEY_ID" \
            "$IN_SP_R2_SECRET_ACCESS_KEY" "$IN_SP_IMPORT_SOURCE_SECRET" "$IN_SP_IMPORT_KEY"; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done
          for name in DOKPLOY_URL DOKPLOY_API_KEY IN_SP_R2_ACCOUNT_ID IN_SP_R2_ACCESS_KEY_ID \
            IN_SP_R2_SECRET_ACCESS_KEY IN_SP_R2_BUCKET; do
            if [ -z "${!name}" ]; then echo "::error::repo secret ${name#IN_} is not set"; exit 1; fi
          done

          api_get() {
            curl --fail-with-body -sS -G "$DOKPLOY_URL/api/$1" \
              -H "x-api-key: $DOKPLOY_API_KEY" --data-urlencode "composeId=$COMPOSE_ID"
          }
          # The body (it may hold secrets) goes through stdin, never argv.
          api_post() {
            curl --fail-with-body -sS -X POST "$DOKPLOY_URL/api/$1" \
              -H "x-api-key: $DOKPLOY_API_KEY" -H "Content-Type: application/json" \
              --data-binary @- > /dev/null
          }
          read_env() { api_get compose.one | jq -r '.env // ""'; }
          mask_env() {
            while IFS= read -r line; do
              case "$line" in *=*) if is_secret "${line%%=*}"; then mask "${line#*=}"; fi ;; esac
            done <<< "$1"
          }
          # Here-strings, not pipes: grep -q/-m1 exiting early would SIGPIPE the writer under pipefail.
          value_of() { { grep -m1 "^$2=" <<< "$1" || true; } | cut -d= -f2-; }
          has_key() { grep -q "^$2=" <<< "$1"; }

          compose="$(api_get compose.one)"
          current="$(jq -r '.env // ""' <<< "$compose")"
          mask_env "$current"

          # Only this workflow deploys (after CI); Dokploy's own git trigger would not wait.
          if [ "$(jq -r '.autoDeploy' <<< "$compose")" != "false" ]; then
            jq -n --arg id "$COMPOSE_ID" '{composeId: $id, autoDeploy: false}' | api_post compose.update
            [ "$(api_get compose.one | jq -r '.autoDeploy')" = "false" ] || { echo "::error::autoDeploy is still on"; exit 1; }
            echo "autoDeploy turned off"
          fi

          next="$current"
          declare -A expected=()
          add() { # add KEY VALUE: only when KEY is missing
            if ! has_key "$next" "$1"; then
              if is_secret "$1"; then mask "$2"; fi
              next="$(printf '%s\n%s=%s' "$next" "$1" "$2" | sed '/^$/d')"
              expected[$1]="$2"
              echo "adding $1"
            fi
          }
          follow() { # follow KEY VALUE: set or update KEY when VALUE is non-empty
            [ -n "$2" ] || return 0
            if is_secret "$1"; then mask "$2"; fi
            if [ "$(value_of "$next" "$1")" != "$2" ]; then
              next="$( { grep -v "^$1=" <<< "$next" || true; printf '%s=%s\n' "$1" "$2"; } | sed '/^$/d')"
              expected[$1]="$2"
              echo "setting $1"
            fi
          }

          # Never generate a password that would not match an existing DATABASE_URL
          # (or a database volume initialised with another one): stop and say which key.
          if has_key "$next" POSTGRES_PASSWORD; then
            password="$(value_of "$next" POSTGRES_PASSWORD)"
            if [ -z "$password" ]; then
              echo "::error::POSTGRES_PASSWORD exists in the Dokploy environment but is empty: set it (and the password in DATABASE_URL) by hand"; exit 1
            fi
          elif has_key "$next" DATABASE_URL; then
            echo "::error::DATABASE_URL exists but POSTGRES_PASSWORD is missing: add POSTGRES_PASSWORD (the password inside DATABASE_URL) by hand"; exit 1
          else
            password="$(openssl rand -hex 32)"
            add POSTGRES_PASSWORD "$password"
          fi
          mask "$password"
          add DATABASE_URL "postgres://sp:${password}@security-partners-db:5432/sp"
          add BETTER_AUTH_SECRET "$(openssl rand -base64 48 | tr -d '\n')"
          add BETTER_AUTH_URL "$SITE_URL"
          add SP_R2_ACCOUNT_ID "$IN_SP_R2_ACCOUNT_ID"
          add SP_R2_ACCESS_KEY_ID "$IN_SP_R2_ACCESS_KEY_ID"
          add SP_R2_SECRET_ACCESS_KEY "$IN_SP_R2_SECRET_ACCESS_KEY"
          add SP_R2_BUCKET "$IN_SP_R2_BUCKET"
          add SP_R2_PREFIX sp
          follow SP_IMPORT_KEY "$IN_SP_IMPORT_KEY"
          follow SP_IMPORT_SOURCE_SECRET "$IN_SP_IMPORT_SOURCE_SECRET"

          if [ "${#expected[@]}" -eq 0 ]; then
            echo "environment complete: nothing to change"
            exit 0
          fi
          jq -n --arg id "$COMPOSE_ID" --arg env "$next" \
            '{composeId: $id, env: $env, createEnvFile: true}' | api_post compose.saveEnvironment

          saved="$(read_env)"
          for key in "${!expected[@]}"; do
            if [ "$(value_of "$saved" "$key")" != "${expected[$key]}" ]; then
              echo "::error::$key was not saved"; exit 1
            fi
          done
          # Every key that existed before is still there, unchanged.
          while IFS= read -r line; do
            case "$line" in *=*) key="${line%%=*}"
              [ -n "${expected[$key]+x}" ] && continue
              [ "$(value_of "$saved" "$key")" = "${line#*=}" ] || { echo "::error::$key changed unexpectedly"; exit 1; } ;;
            esac
          done <<< "$current"
          echo "environment saved and verified: ${!expected[*]}"

  deploy:
    needs: ensure-env
    # !cancelled(): with skip_ci the skipped `ci` job would otherwise skip
    # this job too (implicit success() over the whole needs chain).
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.ensure-env.result == 'success' }}
    runs-on: ubuntu-latest
    # Created on first use; required reviewers are an owner setting.
    environment: production
    steps:
      - name: Trigger Dokploy Deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          echo "Triggering Dokploy deploy for security-partners..."
          curl --fail-with-body -sS -X POST "$DOKPLOY_URL/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"composeId":"NTWy3Bk2X7d8g25YMsbn2","title":"Deploy from GitHub Actions (${{ github.sha }})"}'
          echo "Deployment successfully triggered on Dokploy."
